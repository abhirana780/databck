services:
  - type: web
    name: bi-portal-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: bi_portal
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
